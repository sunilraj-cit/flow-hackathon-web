<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Member Benefits Login - Access your member benefits portal">
    <title>Member Benefits Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #dc2626;
            --primary-red-hover: #b91c1c;
            --primary-red-active: #991b1b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --background: #ffffff;
            --input-background: #f9fafb;
            --error-color: #ef4444;
            --focus-ring: rgba(220, 38, 38, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--background);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07), 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            display: block;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--input-background);
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary-red);
            background-color: var(--background);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .btn-submit {
            width: 100%;
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary-red);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-submit:hover {
            background-color: var(--primary-red-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(220, 38, 38, 0.3);
        }

        .btn-submit:active {
            background-color: var(--primary-red-active);
            transform: translateY(0);
        }

        .btn-submit:focus {
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .form-footer {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .form-link {
            font-size: 0.875rem;
            color: var(--primary-red);
            text-decoration: none;
            text-align: center;
            transition: color 0.2s ease;
        }

        .form-link:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        .form-link:focus {
            outline: 2px solid var(--primary-red);
            outline-offset: 2px;
            border-radius: 4px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-checkbox {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            accent-color: var(--primary-red);
        }

        .checkbox-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .error-message {
            display: none;
            font-size: 0.875rem;
            color: var(--error-color);
            margin-top: 0.25rem;
        }

        .form-input.error {
            border-color: var(--error-color);
        }

        .form-input.error:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }

        .form-group.has-error .error-message {
            display: block;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .form-input,
            .btn-submit {
                font-size: 0.9375rem;
            }
        }

        @media (max-width: 360px) {
            .login-container {
                padding: 1.5rem 1rem;
            }

            .login-header h1 {
                font-size: 1.375rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #f9fafb;
                --text-secondary: #9ca3af;
                --border-color: #374151;
                --background: #1f2937;
                --input-background: #111827;
            }

            body {
                background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            }
        }
    </style>
</head>
<body>
    <main class="login-container" role="main">
        <header class="login-header">
            <h1>Member Benefits</h1>
            <p>Sign in to access your benefits</p>
        </header>

        <form class="login-form" id="loginForm" method="post" action="/api/auth/login" novalidate>
            <div class="form-group" id="usernameGroup">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-input"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                    aria-required="true"
                    aria-describedby="usernameError"
                />
                <span class="error-message" id="usernameError" role="alert"></span>
            </div>

            <div class="form-group" id="passwordGroup">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                    aria-required="true"
                    aria-describedby="passwordError"
                />
                <span class="error-message" id="passwordError" role="alert"></span>
            </div>

            <div class="checkbox-group">
                <input
                    type="checkbox"
                    id="rememberMe"
                    name="rememberMe"
                    class="form-checkbox"
                />
                <label for="rememberMe" class="checkbox-label">Remember me</label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit" id="submitBtn">
                    Sign In
                </button>
            </div>
        </form>

        <footer class="form-footer">
            <a href="/forgot-password" class="form-link">Forgot your password?</a>
            <a href="/register" class="form-link">Don't have an account? Sign up</a>
        </footer>
    </main>

    <script>
        (function() {
            'use strict';

            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const usernameGroup = document.getElementById('usernameGroup');
            const passwordGroup = document.getElementById('passwordGroup');
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');

            /**
             * Validates the username field
             * @returns {boolean} True if valid, false otherwise
             */
            function validateUsername() {
                const value = usernameInput.value.trim();
                
                if (!value) {
                    showError(usernameGroup, usernameInput, usernameError, 'Username is required');
                    return false;
                }
                
                if (value.length < 3) {
                    showError(usernameGroup, usernameInput, usernameError, 'Username must be at least 3 characters');
                    return false;
                }
                
                clearError(usernameGroup, usernameInput, usernameError);
                return true;
            }

            /**
             * Validates the password field
             * @returns {boolean} True if valid, false otherwise
             */
            function validatePassword() {
                const value = passwordInput.value;
                
                if (!value) {
                    showError(passwordGroup, passwordInput, passwordError, 'Password is required');
                    return false;
                }
                
                if (value.length < 6) {
                    showError(passwordGroup, passwordInput, passwordError, 'Password must be at least 6 characters');
                    return false;
                }
                
                clearError(passwordGroup, passwordInput, passwordError);
                return true;
            }

            /**
             * Shows error message for a field
             * @param {HTMLElement} group - Form group element
             * @param {HTMLInputElement} input - Input element
             * @param {HTMLElement} errorElement - Error message element
             * @param {string} message - Error message
             */
            function showError(group, input, errorElement, message) {
                group.classList.add('has-error');
                input.classList.add('error');
                errorElement.textContent = message;
                input.setAttribute('aria-invalid', 'true');
            }

            /**
             * Clears error message for a field
             * @param {HTMLElement} group - Form group element
             * @param {HTMLInputElement} input - Input element
             * @param {HTMLElement} errorElement - Error message element
             */
            function clearError(group, input, errorElement) {
                group.classList.remove('has-error');
                input.classList.remove('error');
                errorElement.textContent = '';
                input.setAttribute('aria-invalid', 'false');
            }

            /**
             * Handles form submission
             * @param {Event} e - Submit event
             */
            function handleSubmit(e) {
                e.preventDefault();

                const isUsernameValid = validateUsername();
                const isPasswordValid = validatePassword();

                if (!isUsernameValid || !isPasswordValid) {
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Signing in...';

                // In production, this would submit to the actual endpoint
                // For now, we'll simulate the form submission
                setTimeout(() => {
                    form.submit();
                }, 500);
            }

            // Event listeners
            form.addEventListener('submit', handleSubmit);
            usernameInput.addEventListener('blur', validateUsername);
            passwordInput.addEventListener('blur', validatePassword);
            
            // Clear errors on input
            usernameInput.addEventListener('input', function() {
                if (usernameGroup.classList.contains('has-error')) {
                    clearError(usernameGroup, usernameInput, usernameError);
                }
            });
            
            passwordInput.addEventListener('input', function() {
                if (passwordGroup.classList.contains('has-error')) {
                    clearError(passwordGroup, passwordInput, passwordError);
                }
            });

            // Focus first input on load
            usernameInput.focus();
        })();
    </script>
</body>
</html>
