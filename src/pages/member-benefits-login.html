<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Member Benefits Login - Access your member benefits account">
    <title>Member Benefits Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .login-card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 100%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.75rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.875rem;
            color: #666;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #ffffff;
        }

        .form-input:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .form-input:disabled {
            background-color: #f3f4f6;
            cursor: not-allowed;
        }

        .form-actions {
            margin-top: 1.5rem;
        }

        .btn-submit {
            width: 100%;
            padding: 0.875rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #dc2626;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #b91c1c;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.3);
        }

        .btn-submit:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .form-footer {
            margin-top: 1.5rem;
            text-align: center;
        }

        .form-footer a {
            color: #dc2626;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .form-footer a:hover {
            color: #b91c1c;
            text-decoration: underline;
        }

        .error-message {
            display: none;
            color: #dc2626;
            font-size: 0.875rem;
            margin-top: 0.5rem;
        }

        .error-message.show {
            display: block;
        }

        .form-input.error {
            border-color: #dc2626;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .form-input,
            .btn-submit {
                font-size: 0.9375rem;
            }
        }

        @media (min-width: 768px) {
            .container {
                max-width: 450px;
            }

            .login-card {
                padding: 2.5rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <article class="login-card">
            <header class="login-header">
                <h1>Member Benefits Login</h1>
                <p>Sign in to access your member benefits</p>
            </header>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                        aria-required="true"
                        aria-describedby="email-error"
                    />
                    <span id="email-error" class="error-message" role="alert"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                        aria-required="true"
                        aria-describedby="password-error"
                    />
                    <span id="password-error" class="error-message" role="alert"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit" id="submitBtn">
                        Sign In
                    </button>
                </div>
            </form>

            <footer class="form-footer">
                <a href="#" id="forgotPassword">Forgot your password?</a>
            </footer>
        </article>
    </main>

    <script>
        (function() {
            'use strict';

            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const emailError = document.getElementById('email-error');
            const passwordError = document.getElementById('password-error');

            /**
             * Validates email format
             * @param {string} email - Email address to validate
             * @returns {boolean} True if valid, false otherwise
             */
            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            /**
             * Shows error message for a field
             * @param {HTMLElement} input - Input element
             * @param {HTMLElement} errorElement - Error message element
             * @param {string} message - Error message to display
             */
            function showError(input, errorElement, message) {
                input.classList.add('error');
                errorElement.textContent = message;
                errorElement.classList.add('show');
            }

            /**
             * Clears error message for a field
             * @param {HTMLElement} input - Input element
             * @param {HTMLElement} errorElement - Error message element
             */
            function clearError(input, errorElement) {
                input.classList.remove('error');
                errorElement.textContent = '';
                errorElement.classList.remove('show');
            }

            /**
             * Validates the email field
             * @returns {boolean} True if valid, false otherwise
             */
            function validateEmail() {
                const email = emailInput.value.trim();

                if (!email) {
                    showError(emailInput, emailError, 'Email address is required');
                    return false;
                }

                if (!isValidEmail(email)) {
                    showError(emailInput, emailError, 'Please enter a valid email address');
                    return false;
                }

                clearError(emailInput, emailError);
                return true;
            }

            /**
             * Validates the password field
             * @returns {boolean} True if valid, false otherwise
             */
            function validatePassword() {
                const password = passwordInput.value;

                if (!password) {
                    showError(passwordInput, passwordError, 'Password is required');
                    return false;
                }

                if (password.length < 6) {
                    showError(passwordInput, passwordError, 'Password must be at least 6 characters');
                    return false;
                }

                clearError(passwordInput, passwordError);
                return true;
            }

            /**
             * Handles form submission
             * @param {Event} event - Submit event
             */
            function handleSubmit(event) {
                event.preventDefault();

                const isEmailValid = validateEmail();
                const isPasswordValid = validatePassword();

                if (isEmailValid && isPasswordValid) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Signing In...';

                    // Simulate form submission
                    setTimeout(function() {
                        console.log('Form submitted successfully');
                        // In production, this would make an API call
                        // window.location.href = '/member-benefits/dashboard';
                        
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Sign In';
                    }, 1500);
                }
            }

            // Event listeners
            form.addEventListener('submit', handleSubmit);

            emailInput.addEventListener('blur', validateEmail);
            passwordInput.addEventListener('blur', validatePassword);

            emailInput.addEventListener('input', function() {
                if (emailError.classList.contains('show')) {
                    clearError(emailInput, emailError);
                }
            });

            passwordInput.addEventListener('input', function() {
                if (passwordError.classList.contains('show')) {
                    clearError(passwordInput, passwordError);
                }
            });

            document.getElementById('forgotPassword').addEventListener('click', function(event) {
                event.preventDefault();
                console.log('Forgot password clicked');
                // In production, this would navigate to password reset page
                // window.location.href = '/member-benefits/forgot-password';
            });
        })();
    </script>
</body>
</html>
