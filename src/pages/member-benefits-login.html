<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Member Benefits Login - Access your member benefits account">
    <title>Member Benefits Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            line-height: 1.6;
        }

        .login-container {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.75rem;
            color: #1a202c;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .login-header p {
            color: #718096;
            font-size: 0.875rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #2d3748;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .form-input::placeholder {
            color: #a0aec0;
        }

        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .btn-submit {
            width: 100%;
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #dc2626;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            background-color: #b91c1c;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 2px 6px rgba(220, 38, 38, 0.3);
        }

        .btn-submit:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.3);
        }

        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }

        .form-footer a {
            color: #dc2626;
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s ease;
        }

        .form-footer a:hover {
            color: #b91c1c;
            text-decoration: underline;
        }

        .error-message {
            display: none;
            padding: 0.75rem 1rem;
            background-color: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: #991b1b;
            font-size: 0.875rem;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .form-input {
                padding: 0.625rem 0.875rem;
                font-size: 0.9375rem;
            }

            .btn-submit {
                padding: 0.75rem 1.25rem;
                font-size: 0.9375rem;
            }
        }

        @media (max-width: 360px) {
            .login-container {
                padding: 1.5rem 1rem;
            }

            .login-header h1 {
                font-size: 1.375rem;
            }
        }

        @media (min-width: 768px) {
            .login-container {
                padding: 3rem;
            }
        }
    </style>
</head>
<body>
    <main class="login-container" role="main">
        <header class="login-header">
            <h1>Member Benefits</h1>
            <p>Sign in to access your account</p>
        </header>

        <div id="error-message" class="error-message" role="alert" aria-live="polite"></div>

        <form class="login-form" id="login-form" method="post" action="/api/login" novalidate>
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-input"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                    aria-required="true"
                    aria-describedby="username-error"
                />
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                    aria-required="true"
                    aria-describedby="password-error"
                />
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-submit" aria-label="Sign in to member benefits">
                    Sign In
                </button>
            </div>
        </form>

        <footer class="form-footer">
            <a href="/forgot-password">Forgot your password?</a>
        </footer>
    </main>

    <script>
        (function() {
            'use strict';

            const form = document.getElementById('login-form');
            const errorMessage = document.getElementById('error-message');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');

            /**
             * Display error message to user
             * @param {string} message - Error message to display
             */
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('show');
            }

            /**
             * Hide error message
             */
            function hideError() {
                errorMessage.textContent = '';
                errorMessage.classList.remove('show');
            }

            /**
             * Validate form inputs
             * @returns {boolean} - Whether form is valid
             */
            function validateForm() {
                hideError();

                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();

                if (!username) {
                    showError('Please enter your username');
                    usernameInput.focus();
                    return false;
                }

                if (!password) {
                    showError('Please enter your password');
                    passwordInput.focus();
                    return false;
                }

                if (username.length < 3) {
                    showError('Username must be at least 3 characters');
                    usernameInput.focus();
                    return false;
                }

                if (password.length < 6) {
                    showError('Password must be at least 6 characters');
                    passwordInput.focus();
                    return false;
                }

                return true;
            }

            /**
             * Handle form submission
             * @param {Event} event - Form submit event
             */
            function handleSubmit(event) {
                event.preventDefault();

                if (!validateForm()) {
                    return;
                }

                // Form is valid, proceed with submission
                // In production, this would make an API call
                console.log('Form submitted successfully');
                
                // Uncomment below to actually submit the form
                // form.submit();
            }

            // Event listeners
            form.addEventListener('submit', handleSubmit);

            // Clear error on input
            usernameInput.addEventListener('input', hideError);
            passwordInput.addEventListener('input', hideError);
        })();
    </script>
</body>
</html>
