<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Member Benefits Login - Access your exclusive member benefits">
    <title>Member Benefits Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #dc2626;
            --primary-red-hover: #b91c1c;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --background: #ffffff;
            --input-background: #f9fafb;
            --error-color: #ef4444;
            --focus-ring: rgba(220, 38, 38, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--background);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-background);
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary-red);
            background: var(--background);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-error {
            font-size: 0.75rem;
            color: var(--error-color);
            display: none;
        }

        .form-error.active {
            display: block;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-input {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            accent-color: var(--primary-red);
        }

        .checkbox-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .forgot-password {
            font-size: 0.875rem;
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }

        .forgot-password:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .submit-button {
            width: 100%;
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: var(--primary-red);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .submit-button:hover {
            background: var(--primary-red-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .submit-button:focus {
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider span {
            padding: 0 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .signup-link {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .signup-link a {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }

        .signup-link a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .login-container {
                padding: 2rem 1.5rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 375px) {
            body {
                padding: 0.5rem;
            }

            .login-container {
                padding: 1.5rem 1rem;
            }

            .login-header h1 {
                font-size: 1.375rem;
            }

            .form-input,
            .submit-button {
                font-size: 0.9375rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="login-container" role="main">
        <header class="login-header">
            <h1>Member Benefits Login</h1>
            <p>Access your exclusive member benefits</p>
        </header>

        <form class="login-form" id="loginForm" novalidate aria-label="Login form">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                    aria-required="true"
                    aria-describedby="email-error"
                />
                <span id="email-error" class="form-error" role="alert"></span>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                    aria-required="true"
                    aria-describedby="password-error"
                />
                <span id="password-error" class="form-error" role="alert"></span>
            </div>

            <div class="form-options">
                <div class="checkbox-group">
                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                        class="checkbox-input"
                    />
                    <label for="remember" class="checkbox-label">Remember me</label>
                </div>
                <a href="/member-benefits/forgot-password" class="forgot-password">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="submit-button" aria-label="Sign in to member benefits">
                Sign In
            </button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="/member-benefits/signup">Sign up</a>
        </div>
    </main>

    <script>
        (function() {
            'use strict';

            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailError = document.getElementById('email-error');
            const passwordError = document.getElementById('password-error');
            const submitButton = form.querySelector('.submit-button');

            /**
             * Validates email format
             * @param {string} email - Email address to validate
             * @returns {boolean} - True if valid, false otherwise
             */
            function validateEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            /**
             * Displays error message for a field
             * @param {HTMLElement} errorElement - Error message element
             * @param {string} message - Error message to display
             */
            function showError(errorElement, message) {
                errorElement.textContent = message;
                errorElement.classList.add('active');
            }

            /**
             * Clears error message for a field
             * @param {HTMLElement} errorElement - Error message element
             */
            function clearError(errorElement) {
                errorElement.textContent = '';
                errorElement.classList.remove('active');
            }

            /**
             * Validates email field
             * @returns {boolean} - True if valid, false otherwise
             */
            function validateEmailField() {
                const email = emailInput.value.trim();
                
                if (!email) {
                    showError(emailError, 'Email address is required');
                    return false;
                }
                
                if (!validateEmail(email)) {
                    showError(emailError, 'Please enter a valid email address');
                    return false;
                }
                
                clearError(emailError);
                return true;
            }

            /**
             * Validates password field
             * @returns {boolean} - True if valid, false otherwise
             */
            function validatePasswordField() {
                const password = passwordInput.value;
                
                if (!password) {
                    showError(passwordError, 'Password is required');
                    return false;
                }
                
                if (password.length < 6) {
                    showError(passwordError, 'Password must be at least 6 characters');
                    return false;
                }
                
                clearError(passwordError);
                return true;
            }

            // Real-time validation
            emailInput.addEventListener('blur', validateEmailField);
            passwordInput.addEventListener('blur', validatePasswordField);

            emailInput.addEventListener('input', function() {
                if (emailError.classList.contains('active')) {
                    validateEmailField();
                }
            });

            passwordInput.addEventListener('input', function() {
                if (passwordError.classList.contains('active')) {
                    validatePasswordField();
                }
            });

            /**
             * Handles form submission
             * @param {Event} event - Submit event
             */
            form.addEventListener('submit', function(event) {
                event.preventDefault();

                const isEmailValid = validateEmailField();
                const isPasswordValid = validatePasswordField();

                if (isEmailValid && isPasswordValid) {
                    submitButton.disabled = true;
                    submitButton.textContent = 'Signing in...';

                    // Simulate API call
                    setTimeout(function() {
                        console.log('Login submitted:', {
                            email: emailInput.value,
                            remember: document.getElementById('remember').checked
                        });
                        
                        // Reset button state
                        submitButton.disabled = false;
                        submitButton.textContent = 'Sign In';
                        
                        // Redirect or show success message
                        // window.location.href = '/member-benefits/dashboard';
                    }, 1500);
                }
            });
        })();
    </script>
</body>
</html>
