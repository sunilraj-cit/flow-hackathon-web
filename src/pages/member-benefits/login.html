<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Member Benefits Login - Access your exclusive member benefits">
    <title>Member Benefits Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #dc2626;
            --primary-red-hover: #b91c1c;
            --primary-red-active: #991b1b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --background: #ffffff;
            --input-background: #f9fafb;
            --error-color: #ef4444;
            --focus-ring: rgba(220, 38, 38, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: var(--text-primary);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--background);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-label .required {
            color: var(--primary-red);
            margin-left: 0.125rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-background);
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary-red);
            background: var(--background);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .form-input:hover:not(:focus) {
            border-color: #9ca3af;
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .form-input.error {
            border-color: var(--error-color);
        }

        .error-message {
            font-size: 0.75rem;
            color: var(--error-color);
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            accent-color: var(--primary-red);
        }

        .remember-me label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .forgot-password {
            font-size: 0.875rem;
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        .submit-button {
            width: 100%;
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: var(--primary-red);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            margin-top: 0.5rem;
        }

        .submit-button:hover {
            background: var(--primary-red-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .submit-button:active {
            background: var(--primary-red-active);
            transform: translateY(0);
        }

        .submit-button:focus {
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .submit-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .login-footer p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-footer a {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .login-footer a:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 640px) {
            .login-container {
                padding: 2rem 1.5rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 375px) {
            .login-container {
                padding: 1.5rem 1rem;
            }

            .login-header h1 {
                font-size: 1.375rem;
            }

            .form-input,
            .submit-button {
                font-size: 0.9375rem;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .form-input {
                border-width: 2px;
            }

            .submit-button {
                border: 2px solid transparent;
            }
        }
    </style>
</head>
<body>
    <main class="login-container" role="main">
        <header class="login-header">
            <h1>Member Benefits Login</h1>
            <p>Access your exclusive member benefits</p>
        </header>

        <form class="login-form" id="loginForm" novalidate aria-label="Login form">
            <div class="form-group">
                <label for="username" class="form-label">
                    Username<span class="required" aria-label="required">*</span>
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-input"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                    aria-required="true"
                    aria-describedby="username-error"
                    aria-invalid="false"
                />
                <span id="username-error" class="error-message" role="alert"></span>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    Password<span class="required" aria-label="required">*</span>
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                    aria-required="true"
                    aria-describedby="password-error"
                    aria-invalid="false"
                />
                <span id="password-error" class="error-message" role="alert"></span>
            </div>

            <div class="form-options">
                <div class="remember-me">
                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                        aria-label="Remember me"
                    />
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="submit-button" aria-label="Sign in to member benefits">
                Sign In
            </button>
        </form>

        <footer class="login-footer">
            <p>
                Don't have an account? 
                <a href="#" aria-label="Create new account">Sign up</a>
            </p>
        </footer>
    </main>

    <script>
        (function() {
            'use strict';

            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('username-error');
            const passwordError = document.getElementById('password-error');

            /**
             * Validates username field
             * @returns {boolean} True if valid, false otherwise
             */
            function validateUsername() {
                const value = usernameInput.value.trim();
                
                if (!value) {
                    showError(usernameInput, usernameError, 'Username is required');
                    return false;
                }
                
                if (value.length < 3) {
                    showError(usernameInput, usernameError, 'Username must be at least 3 characters');
                    return false;
                }
                
                clearError(usernameInput, usernameError);
                return true;
            }

            /**
             * Validates password field
             * @returns {boolean} True if valid, false otherwise
             */
            function validatePassword() {
                const value = passwordInput.value;
                
                if (!value) {
                    showError(passwordInput, passwordError, 'Password is required');
                    return false;
                }
                
                if (value.length < 6) {
                    showError(passwordInput, passwordError, 'Password must be at least 6 characters');
                    return false;
                }
                
                clearError(passwordInput, passwordError);
                return true;
            }

            /**
             * Shows error message for a field
             * @param {HTMLElement} input - Input element
             * @param {HTMLElement} errorElement - Error message element
             * @param {string} message - Error message
             */
            function showError(input, errorElement, message) {
                input.classList.add('error');
                input.setAttribute('aria-invalid', 'true');
                errorElement.textContent = message;
                errorElement.classList.add('visible');
            }

            /**
             * Clears error message for a field
             * @param {HTMLElement} input - Input element
             * @param {HTMLElement} errorElement - Error message element
             */
            function clearError(input, errorElement) {
                input.classList.remove('error');
                input.setAttribute('aria-invalid', 'false');
                errorElement.textContent = '';
                errorElement.classList.remove('visible');
            }

            // Real-time validation
            usernameInput.addEventListener('blur', validateUsername);
            passwordInput.addEventListener('blur', validatePassword);

            // Clear errors on input
            usernameInput.addEventListener('input', function() {
                if (usernameError.classList.contains('visible')) {
                    clearError(usernameInput, usernameError);
                }
            });

            passwordInput.addEventListener('input', function() {
                if (passwordError.classList.contains('visible')) {
                    clearError(passwordInput, passwordError);
                }
            });

            /**
             * Handles form submission
             * @param {Event} event - Submit event
             */
            form.addEventListener('submit', function(event) {
                event.preventDefault();

                const isUsernameValid = validateUsername();
                const isPasswordValid = validatePassword();

                if (isUsernameValid && isPasswordValid) {
                    // Form is valid - handle submission
                    const formData = {
                        username: usernameInput.value.trim(),
                        password: passwordInput.value,
                        remember: document.getElementById('remember').checked
                    };

                    console.log('Form submitted:', formData);
                    
                    // TODO: Implement actual login logic
                    // Example: Send data to authentication endpoint
                    // fetch('/api/auth/login', {
                    //     method: 'POST',
                    //     headers: { 'Content-Type': 'application/json' },
                    //     body: JSON.stringify(formData)
                    // });
                } else {
                    // Focus first invalid field
                    if (!isUsernameValid) {
                        usernameInput.focus();
                    } else if (!isPasswordValid) {
                        passwordInput.focus();
                    }
                }
            });
        })();
    </script>
</body>
</html>
