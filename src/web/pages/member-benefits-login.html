<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Member Benefits Login - Access your member benefits account">
    <meta name="theme-color" content="#dc2626">
    <title>Member Benefits Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #dc2626;
            --primary-red-hover: #b91c1c;
            --primary-red-active: #991b1b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --background: #ffffff;
            --background-secondary: #f9fafb;
            --error: #ef4444;
            --focus-ring: rgba(220, 38, 38, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: var(--background-secondary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--background);
            border-radius: 8px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            padding: 2rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-label .required {
            color: var(--primary-red);
            margin-left: 0.125rem;
        }

        .form-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-primary);
            background-color: var(--background);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .form-input:disabled {
            background-color: var(--background-secondary);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .form-input.error {
            border-color: var(--error);
        }

        .form-input.error:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }

        .form-error {
            font-size: 0.875rem;
            color: var(--error);
            display: none;
        }

        .form-error.visible {
            display: block;
        }

        .form-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            accent-color: var(--primary-red);
        }

        .remember-me label {
            font-size: 0.875rem;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
        }

        .forgot-password {
            font-size: 0.875rem;
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease-in-out;
        }

        .forgot-password:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        .forgot-password:focus {
            outline: 2px solid var(--primary-red);
            outline-offset: 2px;
            border-radius: 2px;
        }

        .btn-primary {
            width: 100%;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary-red);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out, transform 0.1s ease-in-out;
            text-align: center;
        }

        .btn-primary:hover {
            background-color: var(--primary-red-hover);
        }

        .btn-primary:active {
            background-color: var(--primary-red-active);
            transform: scale(0.98);
        }

        .btn-primary:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .btn-primary:disabled {
            background-color: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .login-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-footer a {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease-in-out;
        }

        .login-footer a:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        .login-footer a:focus {
            outline: 2px solid var(--primary-red);
            outline-offset: 2px;
            border-radius: 2px;
        }

        @media (max-width: 640px) {
            .login-container {
                padding: 1.5rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .form-footer {
                flex-direction: column;
                align-items: flex-start;
            }

            .forgot-password {
                margin-left: auto;
            }
        }

        @media (max-width: 375px) {
            body {
                padding: 0.5rem;
            }

            .login-container {
                padding: 1.25rem;
            }

            .login-header h1 {
                font-size: 1.375rem;
            }

            .form-input,
            .btn-primary {
                font-size: 0.9375rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="login-container" role="main">
        <header class="login-header">
            <h1>Member Benefits Login</h1>
            <p>Access your member benefits account</p>
        </header>

        <form class="login-form" id="loginForm" novalidate aria-label="Login form">
            <div class="form-group">
                <label for="email" class="form-label">
                    Email Address<span class="required" aria-label="required">*</span>
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                    aria-required="true"
                    aria-describedby="email-error"
                    aria-invalid="false"
                />
                <span id="email-error" class="form-error" role="alert"></span>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    Password<span class="required" aria-label="required">*</span>
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                    aria-required="true"
                    aria-describedby="password-error"
                    aria-invalid="false"
                />
                <span id="password-error" class="form-error" role="alert"></span>
            </div>

            <div class="form-footer">
                <div class="remember-me">
                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                        aria-label="Remember me"
                    />
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary" aria-label="Sign in to your account">
                Sign In
            </button>
        </form>

        <footer class="login-footer">
            <p>Don't have an account? <a href="#">Sign up</a></p>
        </footer>
    </main>

    <script>
        (function() {
            'use strict';

            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailError = document.getElementById('email-error');
            const passwordError = document.getElementById('password-error');

            /**
             * Validates email format
             * @param {string} email - Email address to validate
             * @returns {boolean} True if valid, false otherwise
             */
            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            /**
             * Shows error message for a field
             * @param {HTMLInputElement} input - Input element
             * @param {HTMLElement} errorElement - Error message element
             * @param {string} message - Error message
             */
            function showError(input, errorElement, message) {
                input.classList.add('error');
                input.setAttribute('aria-invalid', 'true');
                errorElement.textContent = message;
                errorElement.classList.add('visible');
            }

            /**
             * Clears error message for a field
             * @param {HTMLInputElement} input - Input element
             * @param {HTMLElement} errorElement - Error message element
             */
            function clearError(input, errorElement) {
                input.classList.remove('error');
                input.setAttribute('aria-invalid', 'false');
                errorElement.textContent = '';
                errorElement.classList.remove('visible');
            }

            /**
             * Validates email field
             * @returns {boolean} True if valid, false otherwise
             */
            function validateEmail() {
                const email = emailInput.value.trim();

                if (!email) {
                    showError(emailInput, emailError, 'Email address is required');
                    return false;
                }

                if (!isValidEmail(email)) {
                    showError(emailInput, emailError, 'Please enter a valid email address');
                    return false;
                }

                clearError(emailInput, emailError);
                return true;
            }

            /**
             * Validates password field
             * @returns {boolean} True if valid, false otherwise
             */
            function validatePassword() {
                const password = passwordInput.value;

                if (!password) {
                    showError(passwordInput, passwordError, 'Password is required');
                    return false;
                }

                if (password.length < 6) {
                    showError(passwordInput, passwordError, 'Password must be at least 6 characters');
                    return false;
                }

                clearError(passwordInput, passwordError);
                return true;
            }

            // Real-time validation on blur
            emailInput.addEventListener('blur', validateEmail);
            passwordInput.addEventListener('blur', validatePassword);

            // Clear errors on input
            emailInput.addEventListener('input', function() {
                if (emailError.classList.contains('visible')) {
                    clearError(emailInput, emailError);
                }
            });

            passwordInput.addEventListener('input', function() {
                if (passwordError.classList.contains('visible')) {
                    clearError(passwordInput, passwordError);
                }
            });

            /**
             * Handles form submission
             * @param {Event} event - Submit event
             */
            form.addEventListener('submit', function(event) {
                event.preventDefault();

                const isEmailValid = validateEmail();
                const isPasswordValid = validatePassword();

                if (isEmailValid && isPasswordValid) {
                    // Form is valid, proceed with submission
                    const formData = {
                        email: emailInput.value.trim(),
                        password: passwordInput.value,
                        remember: document.getElementById('remember').checked
                    };

                    console.log('Form submitted:', formData);
                    
                    // Disable submit button during processing
                    const submitButton = form.querySelector('button[type="submit"]');
                    submitButton.disabled = true;
                    submitButton.textContent = 'Signing In...';

                    // Simulate API call (replace with actual implementation)
                    setTimeout(function() {
                        submitButton.disabled = false;
                        submitButton.textContent = 'Sign In';
                        alert('Login functionality would be implemented here');
                    }, 1500);
