<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Member Benefits Login - Access your member benefits account">
    <meta name="theme-color" content="#dc2626">
    <title>Member Benefits Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #dc2626;
            --primary-red-hover: #b91c1c;
            --primary-red-active: #991b1b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --background: #ffffff;
            --input-background: #f9fafb;
            --error-color: #ef4444;
            --focus-ring: rgba(220, 38, 38, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: var(--input-background);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--background);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-label .required {
            color: var(--primary-red);
            margin-left: 0.125rem;
        }

        .form-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-primary);
            background-color: var(--input-background);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.15s ease-in-out;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-red);
            background-color: var(--background);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-input.error {
            border-color: var(--error-color);
        }

        .form-error {
            font-size: 0.75rem;
            color: var(--error-color);
            display: none;
        }

        .form-error.visible {
            display: block;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-input {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            accent-color: var(--primary-red);
        }

        .checkbox-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .forgot-password {
            font-size: 0.875rem;
            color: var(--primary-red);
            text-decoration: none;
            transition: color 0.15s ease-in-out;
        }

        .forgot-password:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        .submit-button {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--background);
            background-color: var(--primary-red);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            margin-top: 0.5rem;
        }

        .submit-button:hover {
            background-color: var(--primary-red-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.3);
        }

        .submit-button:active {
            background-color: var(--primary-red-active);
            transform: translateY(0);
        }

        .submit-button:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .login-footer p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-footer a {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease-in-out;
        }

        .login-footer a:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .login-container {
                padding: 1.5rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 375px) {
            body {
                padding: 0.5rem;
            }

            .login-container {
                padding: 1.25rem;
            }

            .login-header h1 {
                font-size: 1.375rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="login-container" role="main">
        <header class="login-header">
            <h1>Member Benefits Login</h1>
            <p>Access your member benefits account</p>
        </header>

        <form class="login-form" id="loginForm" novalidate aria-label="Login form">
            <div class="form-group">
                <label for="username" class="form-label">
                    Username<span class="required" aria-label="required">*</span>
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-input"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                    aria-required="true"
                    aria-describedby="username-error"
                    aria-invalid="false"
                />
                <span id="username-error" class="form-error" role="alert">
                    Please enter a valid username
                </span>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    Password<span class="required" aria-label="required">*</span>
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                    aria-required="true"
                    aria-describedby="password-error"
                    aria-invalid="false"
                />
                <span id="password-error" class="form-error" role="alert">
                    Please enter your password
                </span>
            </div>

            <div class="form-options">
                <div class="checkbox-group">
                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                        class="checkbox-input"
                        aria-label="Remember me"
                    />
                    <label for="remember" class="checkbox-label">
                        Remember me
                    </label>
                </div>
                <a href="#" class="forgot-password" aria-label="Forgot password">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="submit-button" aria-label="Sign in to your account">
                Sign In
            </button>
        </form>

        <footer class="login-footer">
            <p>
                Don't have an account?
                <a href="#" aria-label="Create new account">Sign up</a>
            </p>
        </footer>
    </main>

    <script>
        (function() {
            'use strict';

            const form = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('username-error');
            const passwordError = document.getElementById('password-error');

            function validateUsername() {
                const value = usernameInput.value.trim();
                if (value.length === 0) {
                    showError(usernameInput, usernameError, 'Please enter a valid username');
                    return false;
                }
                hideError(usernameInput, usernameError);
                return true;
            }

            function validatePassword() {
                const value = passwordInput.value;
                if (value.length === 0) {
                    showError(passwordInput, passwordError, 'Please enter your password');
                    return false;
                }
                hideError(passwordInput, passwordError);
                return true;
            }

            function showError(input, errorElement, message) {
                input.classList.add('error');
                input.setAttribute('aria-invalid', 'true');
                errorElement.textContent = message;
                errorElement.classList.add('visible');
            }

            function hideError(input, errorElement) {
                input.classList.remove('error');
                input.setAttribute('aria-invalid', 'false');
                errorElement.classList.remove('visible');
            }

            usernameInput.addEventListener('blur', validateUsername);
            passwordInput.addEventListener('blur', validatePassword);

            usernameInput.addEventListener('input', function() {
                if (usernameInput.classList.contains('error')) {
                    validateUsername();
                }
            });

            passwordInput.addEventListener('input', function() {
                if (passwordInput.classList.contains('error')) {
                    validatePassword();
                }
            });

            form.addEventListener('submit', function(event) {
                event.preventDefault();

                const isUsernameValid = validateUsername();
                const isPasswordValid = validatePassword();

                if (isUsernameValid && isPasswordValid) {
                    console.log('Form is valid. Submitting...');
                    // Add your form submission logic here
                } else {
                    const firstInvalidInput = !isUsernameValid ? usernameInput : passwordInput;
                    firstInvalidInput.focus();
                }
            });
        })();
    </script>
</body>
</html>
