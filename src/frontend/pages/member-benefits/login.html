<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Member Benefits Login - Access your exclusive member benefits and rewards">
    <meta name="theme-color" content="#dc2626">
    <title>Member Benefits Login</title>
    <link rel="icon" href="/icons/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #dc2626;
            --primary-red-hover: #b91c1c;
            --primary-red-active: #991b1b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --background: #ffffff;
            --background-secondary: #f9fafb;
            --error-color: #ef4444;
            --focus-ring: rgba(220, 38, 38, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: var(--background-secondary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--background);
            border-radius: 8px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            padding: 2rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            display: block;
        }

        .form-label .required {
            color: var(--primary-red);
            margin-left: 0.125rem;
        }

        .form-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-primary);
            background-color: var(--background);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .form-input:disabled {
            background-color: var(--background-secondary);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .form-input.error {
            border-color: var(--error-color);
        }

        .form-input.error:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }

        .form-error {
            font-size: 0.875rem;
            color: var(--error-color);
            display: none;
        }

        .form-error.visible {
            display: block;
        }

        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            accent-color: var(--primary-red);
        }

        .remember-me label {
            font-size: 0.875rem;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
        }

        .forgot-password {
            font-size: 0.875rem;
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease-in-out;
        }

        .forgot-password:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary-red);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out, transform 0.1s ease-in-out;
            text-align: center;
        }

        .btn-login:hover {
            background-color: var(--primary-red-hover);
        }

        .btn-login:active {
            background-color: var(--primary-red-active);
            transform: scale(0.98);
        }

        .btn-login:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .btn-login:disabled {
            background-color: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .login-footer {
            margin-top: 1.5rem;
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .login-footer p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-footer a {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease-in-out;
        }

        .login-footer a:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        @media (max-width: 640px) {
            .login-container {
                padding: 1.5rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 375px) {
            body {
                padding: 0.5rem;
            }

            .login-container {
                padding: 1.25rem;
            }

            .login-header h1 {
                font-size: 1.375rem;
            }

            .form-input {
                font-size: 0.9375rem;
            }
        }

        @media (min-width: 768px) {
            .login-container {
                padding: 2.5rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="login-container" role="main">
        <header class="login-header">
            <h1>Member Benefits Login</h1>
            <p>Access your exclusive member benefits and rewards</p>
        </header>

        <form class="login-form" id="loginForm" method="POST" action="/api/auth/login" novalidate>
            <div class="form-group">
                <label for="emailOrUsername" class="form-label">
                    Email or Username
                    <span class="required" aria-label="required">*</span>
                </label>
                <input
                    type="text"
                    id="emailOrUsername"
                    name="emailOrUsername"
                    class="form-input"
                    placeholder="Enter your email or username"
                    required
                    autocomplete="username"
                    aria-required="true"
                    aria-describedby="emailOrUsernameError"
                    aria-invalid="false"
                />
                <span id="emailOrUsernameError" class="form-error" role="alert"></span>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    Password
                    <span class="required" aria-label="required">*</span>
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                    aria-required="true"
                    aria-describedby="passwordError"
                    aria-invalid="false"
                    minlength="8"
                />
                <span id="passwordError" class="form-error" role="alert"></span>
            </div>

            <div class="form-options">
                <div class="remember-me">
                    <input
                        type="checkbox"
                        id="rememberMe"
                        name="rememberMe"
                        value="true"
                    />
                    <label for="rememberMe">Remember me</label>
                </div>
                <a href="/member-benefits/forgot-password" class="forgot-password">
                    Forgot password?
                </a>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-login" aria-label="Sign in to member benefits">
                    Sign In
                </button>
            </div>
        </form>

        <footer class="login-footer">
            <p>
                Don't have an account?
                <a href="/member-benefits/register">Sign up</a>
            </p>
        </footer>
    </main>

    <script>
        (function() {
            'use strict';

            const form = document.getElementById('loginForm');
            const emailOrUsernameInput = document.getElementById('emailOrUsername');
            const passwordInput = document.getElementById('password');
            const emailOrUsernameError = document.getElementById('emailOrUsernameError');
            const passwordError = document.getElementById('passwordError');

            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(String(email).toLowerCase());
            }

            function validateUsername(username) {
                return username.length >= 3;
            }

            function validatePassword(password) {
                return password.length >= 8;
            }

            function showError(input, errorElement, message) {
                input.classList.add('error');
                input.setAttribute('aria-invalid', 'true');
                errorElement.textContent = message;
                errorElement.classList.add('visible');
            }

            function clearError(input, errorElement) {
                input.classList.remove('error');
                input.setAttribute('aria-invalid', 'false');
                errorElement.textContent = '';
                errorElement.classList.remove('visible');
            }

            function validateEmailOrUsername() {
                const value = emailOrUsernameInput.value.trim();
                
                if (!value) {
                    showError(emailOrUsernameInput, emailOrUsernameError, 'Email or username is required');
                    return false;
                }

                const isEmail = value.includes('@');
                
                if (isEmail && !validateEmail(value)) {
                    showError(emailOrUsernameInput, emailOrUsernameError, 'Please enter a valid email address');
                    return false;
                }

                if (!isEmail && !validateUsername(value)) {
                    showError(emailOrUsernameInput, emailOrUsernameError, 'Username must be at least 3 characters');
                    return false;
                }

                clearError(emailOrUsernameInput, emailOrUsernameError);
                return true;
            }

            function validatePasswordField() {
                const value = passwordInput.value;
                
                if (!value) {
                    showError(passwordInput, passwordError, 'Password is required');
                    return false;
                }

                if (!validatePassword(value)) {
                    showError(passwordInput, passwordError, 'Password must be at least 8 characters');
                    return false;
                }

                clearError(passwordInput, passwordError);
                return true;
            }

            emailOrUsernameInput.addEventListener('blur', validateEmailOrUsername);
            passwordInput.addEventListener('blur', validatePasswordField);

            emailOrUsernameInput.addEventListener('input', function() {
                if (emailOrUsernameError.classList.contains('visible')) {
                    validateEmailOrUsername();
                }
            });

            passwordInput.addEventListener('input', function() {
                if (passwordError.classList.contains('visible')) {
                    validatePasswordField();
                }
            });

            form.addEventListener('submit', function(event) {
                event.preventDefault();

                const isEmailOrUsernameValid = validateEmail
