<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Member Benefits Login - Access your exclusive member benefits and rewards">
    <meta name="theme-color" content="#dc2626">
    <title>Member Benefits Login</title>
    <link rel="icon" href="/icons/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #dc2626;
            --primary-red-hover: #b91c1c;
            --primary-red-active: #991b1b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --background: #ffffff;
            --background-secondary: #f9fafb;
            --error-color: #ef4444;
            --focus-ring: rgba(220, 38, 38, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: var(--background-secondary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
            width: 100%;
        }

        .login-card {
            background-color: var(--background);
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
            display: block;
        }

        .form-label .required {
            color: var(--primary-red);
            margin-left: 0.125rem;
        }

        .form-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-primary);
            background-color: var(--background);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .form-input:disabled {
            background-color: var(--background-secondary);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .form-input.error {
            border-color: var(--error-color);
        }

        .form-input.error:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }

        .error-message {
            font-size: 0.875rem;
            color: var(--error-color);
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-checkbox {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            accent-color: var(--primary-red);
        }

        .checkbox-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .forgot-password-link {
            font-size: 0.875rem;
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease-in-out;
        }

        .forgot-password-link:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        .forgot-password-link:focus {
            outline: 2px solid var(--primary-red);
            outline-offset: 2px;
            border-radius: 0.125rem;
        }

        .submit-button {
            width: 100%;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary-red);
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out, transform 0.1s ease-in-out;
            text-align: center;
        }

        .submit-button:hover {
            background-color: var(--primary-red-hover);
        }

        .submit-button:active {
            background-color: var(--primary-red-active);
            transform: scale(0.98);
        }

        .submit-button:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .submit-button:disabled {
            background-color: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .login-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .signup-link {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s ease-in-out;
        }

        .signup-link:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        .signup-link:focus {
            outline: 2px solid var(--primary-red);
            outline-offset: 2px;
            border-radius: 0.125rem;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider::before {
            margin-right: 0.75rem;
        }

        .divider::after {
            margin-left: 0.75rem;
        }

        /* Responsive Design */
        @media (max-width: 640px) {
            .login-card {
                padding: 1.5rem;
                box-shadow: none;
                border-radius: 0;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (min-width: 641px) and (max-width: 1024px) {
            .login-card {
                max-width: 450px;
                padding: 2.5rem;
            }
        }

        @media (min-width: 1025px) {
            .login-card {
                max-width: 480px;
                padding: 3rem;
            }

            .login-header h1 {
                font-size: 2rem;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .form-input {
                border-width: 2px;
            }

            .submit-button {
                border: 2px solid transparent;
            }
        }

        /* Loading state */
        .loading {
            position: relative;
            pointer-events: none;
        }

        .loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1.25rem;
            height: 1.25rem;
            margin-top: -0.625rem;
            margin-left: -0.625rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <main class="login-container" role="main">
        <article class="login-card">
            <header class="login-header">
                <h1>Member Benefits Login</h1>
                <p>Access your exclusive member benefits and rewards</p>
            </header>

            <form class="login-form" id="loginForm" method="POST" action="/api/auth/login" novalidate>
                <div class="form-group">
                    <label for="emailOrUsername" class="form-label">
                        Email or Username
                        <span class="required" aria-label="required">*</span>
                    </label>
                    <input
                        type="text"
                        id="emailOrUsername"
                        name="emailOrUsername"
                        class="form-input"
                        placeholder="Enter your email or username"
                        required
                        autocomplete="username"
                        aria-required="true"
                        aria-describedby="emailOrUsernameError"
                        aria-invalid="false"
                    />
                    <span id="emailOrUsernameError" class="error-message" role="alert"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        Password
                        <span class="required" aria-label="required">*</span>
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                        aria-required="true"
                        aria-describedby="passwordError"
                        aria-invalid="false"
                        minlength="8"
                    />
                    <span id="passwordError" class="error-message" role="alert"></span>
                </div>

                <div class="form-options">
                    <div class="checkbox-group">
                        <input
                            type="checkbox"
                            id="rememberMe"
                            name="rememberMe"
                            class="form-checkbox"
                            aria-label="Remember me on this device"
                        />
                        <label for="rememberMe" class="checkbox-label">Remember me</label>
                    </div>
                    <a href="/member-benefits/forgot-password" class="forgot-password-link">
                        Forgot password?
                    </a>
                </div>

                <button type="submit" class="submit-button" aria-label="Sign in to member benefits">
                    Sign In
                </button>
            </form>

            <div class="divider" role="separator" aria-label="or">or</div>

            <footer class="login-footer">
                <p>
                    Don't have an account?
                    <a href="/member-benefits/signup" class="signup-link">Sign up</a>
                </p>
            </footer>
        </article>
    </main>

    <script>
        (function() {
            'use strict';

            const form = document.getElementById('loginForm');
            const emailOrUsernameInput = document.getElementById('emailOrUsername');
            const passwordInput = document.getElementById('password');
            const submitButton = form.querySelector('.submit-button');

            /**
             * Validates email format
             * @param {string} email - Email to validate
             * @returns {boolean} - Whether email is valid
             */
            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            /**
             * Validates username format
             * @param {string} username - Username to validate
             * @returns {boolean} - Whether username is valid
             */
            function isValidUsername(username) {
                return username.length >= 3 && username.length <= 50;
            }

            /**
             * Shows error message for a field
             * @param {HTMLInputElement} input - Input element
             * @param {string} message - Error message
             */
            function showError(input, message) {
                const errorElement = document.getElementById(input.id + 'Error');
                input.classList.add('error');
