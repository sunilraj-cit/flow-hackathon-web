<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Member Benefits Login - Access your exclusive member benefits and rewards">
    <meta name="keywords" content="member benefits, login, member portal, rewards">
    <meta name="author" content="Member Benefits Portal">
    <meta name="theme-color" content="#dc2626">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Member Benefits Login">
    <meta property="og:description" content="Access your exclusive member benefits and rewards">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Member Benefits Login">
    <meta name="twitter:description" content="Access your exclusive member benefits and rewards">
    
    <title>Member Benefits Login</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-red: #dc2626;
            --primary-red-hover: #b91c1c;
            --primary-red-active: #991b1b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --background: #ffffff;
            --background-secondary: #f9fafb;
            --error-color: #ef4444;
            --focus-ring: rgba(220, 38, 38, 0.2);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: var(--background-secondary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--background);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .login-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .form-label .required {
            color: var(--primary-red);
            margin-left: 0.125rem;
        }
        
        .form-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--background);
            color: var(--text-primary);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }
        
        .form-input::placeholder {
            color: var(--text-secondary);
        }
        
        .form-input.error {
            border-color: var(--error-color);
        }
        
        .form-error {
            font-size: 0.75rem;
            color: var(--error-color);
            display: none;
        }
        
        .form-error.visible {
            display: block;
        }
        
        .form-checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .form-checkbox {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            accent-color: var(--primary-red);
        }
        
        .form-checkbox-label {
            font-size: 0.875rem;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
        }
        
        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        
        .btn-primary {
            width: 100%;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary-red);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-red-hover);
        }
        
        .btn-primary:active {
            background-color: var(--primary-red-active);
            transform: scale(0.98);
        }
        
        .btn-primary:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }
        
        .btn-primary:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
            transform: none;
        }
        
        .forgot-password {
            text-align: center;
        }
        
        .forgot-password a {
            font-size: 0.875rem;
            color: var(--primary-red);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        .forgot-password a:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        
        .divider span {
            padding: 0 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .signup-link {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .signup-link a {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        
        .signup-link a:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }
        
        /* Responsive Design */
        @media (max-width: 640px) {
            .login-container {
                padding: 1.5rem;
            }
            
            .login-header h1 {
                font-size: 1.5rem;
            }
            
            .form-input {
                font-size: 0.875rem;
            }
            
            .btn-primary {
                font-size: 0.875rem;
                padding: 0.625rem 1.25rem;
            }
        }
        
        @media (max-width: 375px) {
            body {
                padding: 0.5rem;
            }
            
            .login-container {
                padding: 1.25rem;
            }
            
            .login-header h1 {
                font-size: 1.25rem;
            }
        }
        
        @media (min-width: 768px) {
            .login-container {
                padding: 2.5rem;
            }
        }
        
        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* Loading State */
        .btn-primary.loading {
            position: relative;
            color: transparent;
        }
        
        .btn-primary.loading::after {
            content: '';
            position: absolute;
            width: 1rem;
            height: 1rem;
            top: 50%;
            left: 50%;
            margin-left: -0.5rem;
            margin-top: -0.5rem;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spinner 0.6s linear infinite;
        }
        
        @keyframes spinner {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <main class="login-container" role="main">
        <header class="login-header">
            <h1>Member Benefits</h1>
            <p>Sign in to access your exclusive benefits</p>
        </header>
        
        <form class="login-form" id="loginForm" novalidate aria-label="Login form">
            <div class="form-group">
                <label for="email" class="form-label">
                    Email Address<span class="required" aria-label="required">*</span>
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input" 
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                    aria-required="true"
                    aria-describedby="email-error"
                    aria-invalid="false"
                />
                <span id="email-error" class="form-error" role="alert"></span>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">
                    Password<span class="required" aria-label="required">*</span>
                </label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                    aria-required="true"
                    aria-describedby="password-error"
                    aria-invalid="false"
                />
                <span id="password-error" class="form-error" role="alert"></span>
            </div>
            
            <div class="form-checkbox-group">
                <input 
                    type="checkbox" 
                    id="remember" 
                    name="remember" 
                    class="form-checkbox"
                    aria-label="Remember me"
                />
                <label for="remember" class="form-checkbox-label">
                    Remember me
                </label>
            </div>
            
            <div class="form-actions">
                <button 
                    type="submit" 
                    class="btn-primary" 
                    id="loginButton"
                    aria-label="Sign in to member benefits"
                >
                    Sign In
                </button>
                
                <div class="forgot-password">
                    <a href="/member-benefits/forgot-password" aria-label="Forgot your password?">
                        Forgot your password?
                    </a>
                </div>
            </div>
        </form>
        
        <div class="divider" role="separator" aria-label="or">
            <span>or</span>
        </div>
        
        <div class="signup-link">
            Don't have an account? <a href="/member-benefits/signup" aria-label="Create a new account">Sign up</a>
        </div>
    </main>
    
    <script>
        (function() {
            'use strict';
            
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginButton = document.getElementById('loginButton');
            const emailError = document.getElementById('email-error');
            const passwordError = document.getElementById('password-error');
            
            /**
             * Validates email format
             * @param {string} email - Email address to validate
             * @returns {boolean} - True if valid, false otherwise
             */
            function validateEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }
            
            /**
             * Displays error message for a field
             * @param {HTMLElement} input - Input element
             * @param {HTMLElement} errorElement - Error message element
             * @param {string} message - Error message
             */
            function showError(input, errorElement, message) {
                input.classList.add('error');
                input.setAttribute('aria-invalid', 'true');
                errorElement.textContent = message;
                errorElement.classList.add('visible');
            }
            
            /**
             * Clears error message for a field
             * @param {HTMLElement} input - Input element
             * @param {HTMLElement} errorElement - Error message element
             */
            function clearError(input, errorElement) {
                input.classList.remove('error');
                input.setAttribute('aria-invalid', 'false');
                errorElement.textContent = '';
                errorElement.classList.remove('visible');
            }
            
            /**
             * Validates form fields
             * @returns {boolean} - True if form is valid, false otherwise
             */
            function validateForm() {
                let isValid = true;
                
                // Validate email
                const emailValue = emailInput.value.trim();
                if (!emailValue) {
                    showError(emailInput, emailError, 'Email address is required');
                    isValid = false;
                } else if (!validateEmail(emailValue)) {
                    showError(emailInput, emailError, 'Please enter a valid email
