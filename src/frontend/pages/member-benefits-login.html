<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Member Benefits Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.75rem;
            color: #1a202c;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .login-header p {
            color: #718096;
            font-size: 0.875rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #2d3748;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .form-input::placeholder {
            color: #a0aec0;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.875rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
        }

        .remember-me label {
            color: #4a5568;
            cursor: pointer;
        }

        .forgot-password {
            color: #dc2626;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: #b91c1c;
        }

        .login-button {
            width: 100%;
            padding: 0.875rem;
            background-color: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .login-button:hover {
            background-color: #b91c1c;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: #a0aec0;
            font-size: 0.875rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider span {
            padding: 0 1rem;
        }

        .signup-link {
            text-align: center;
            font-size: 0.875rem;
            color: #4a5568;
        }

        .signup-link a {
            color: #dc2626;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .signup-link a:hover {
            color: #b91c1c;
        }

        .error-message {
            display: none;
            padding: 0.75rem;
            background-color: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: #991b1b;
            font-size: 0.875rem;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }
        }

        @media (max-width: 360px) {
            .login-container {
                padding: 1.5rem 1rem;
            }

            .login-header h1 {
                font-size: 1.25rem;
            }

            .form-input,
            .login-button {
                font-size: 0.875rem;
            }
        }

        @media (min-width: 768px) {
            .login-container {
                padding: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Member Benefits Login</h1>
            <p>Access your exclusive member benefits</p>
        </div>

        <div id="errorMessage" class="error-message" role="alert"></div>

        <form class="login-form" id="loginForm" novalidate>
            <div class="form-group">
                <label for="emailUsername" class="form-label">Email or Username</label>
                <input 
                    type="text" 
                    id="emailUsername" 
                    name="emailUsername" 
                    class="form-input" 
                    placeholder="Enter your email or username"
                    required
                    autocomplete="username"
                    aria-required="true"
                    aria-describedby="emailUsernameError"
                />
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                    aria-required="true"
                    aria-describedby="passwordError"
                />
            </div>

            <div class="form-options">
                <div class="remember-me">
                    <input 
                        type="checkbox" 
                        id="rememberMe" 
                        name="rememberMe"
                        aria-label="Remember me"
                    />
                    <label for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="login-button" id="loginButton">
                Sign In
            </button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

    <script>
        /**
         * Handle form submission
         * @param {Event} event - Form submit event
         */
        function handleSubmit(event) {
            event.preventDefault();
            
            const form = event.target;
            const emailUsername = form.emailUsername.value.trim();
            const password = form.password.value;
            const errorMessage = document.getElementById('errorMessage');
            const loginButton = document.getElementById('loginButton');
            
            // Clear previous errors
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';
            
            // Basic validation
            if (!emailUsername) {
                showError('Please enter your email or username');
                return;
            }
            
            if (!password) {
                showError('Please enter your password');
                return;
            }
            
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }
            
            // Disable button during submission
            loginButton.disabled = true;
            loginButton.textContent = 'Signing in...';
            
            // Simulate API call (replace with actual authentication logic)
            setTimeout(() => {
                // Re-enable button
                loginButton.disabled = false;
                loginButton.textContent = 'Sign In';
                
                // Handle success/error
                console.log('Login attempt:', { emailUsername, rememberMe: form.rememberMe.checked });
                
                // Example: Redirect on success
                // window.location.href = '/member-benefits/dashboard';
            }, 1500);
        }
        
        /**
         * Display error message
         * @param {string} message - Error message to display
         */
        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }
        
        // Attach event listener
        document.getElementById('loginForm').addEventListener('submit', handleSubmit);
        
        // Clear error on input
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('input', () => {
                const errorMessage = document.getElementById('errorMessage');
                if (errorMessage.classList.contains('show')) {
                    errorMessage.classList.remove('show');
                }
            });
        });
    </script>
</body>
</html>
