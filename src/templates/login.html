<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Member Benefits Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #dc2626;
            --primary-red-hover: #b91c1c;
            --primary-red-active: #991b1b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --background: #ffffff;
            --input-background: #f9fafb;
            --error-color: #ef4444;
            --focus-ring: rgba(220, 38, 38, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: var(--text-primary);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: var(--background);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-background);
            color: var(--text-primary);
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary-red);
            background: var(--background);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-error {
            font-size: 0.75rem;
            color: var(--error-color);
            display: none;
        }

        .form-error.active {
            display: block;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            accent-color: var(--primary-red);
        }

        .checkbox-group label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .forgot-password {
            font-size: 0.875rem;
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            padding: 0.875rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: var(--primary-red);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            margin-top: 0.5rem;
        }

        .login-button:hover {
            background: var(--primary-red-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.3);
        }

        .login-button:active {
            background: var(--primary-red-active);
            transform: translateY(0);
        }

        .login-button:focus {
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider span {
            padding: 0 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .signup-link {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .signup-link a {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .signup-link a:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        /* Mobile First - Base styles above are for mobile */

        /* Tablet styles */
        @media (min-width: 640px) {
            .login-container {
                padding: 2.5rem;
            }

            .login-header h1 {
                font-size: 2rem;
            }

            .form-input {
                padding: 0.875rem 1.125rem;
            }

            .login-button {
                padding: 1rem 1.5rem;
            }
        }

        /* Desktop styles */
        @media (min-width: 1024px) {
            .login-container {
                max-width: 450px;
                padding: 3rem;
            }

            .login-header h1 {
                font-size: 2.25rem;
            }

            .login-header p {
                font-size: 1rem;
            }
        }

        /* High resolution displays */
        @media (min-width: 1440px) {
            body {
                padding: 2rem;
            }
        }

        /* Accessibility - Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #f9fafb;
                --text-secondary: #d1d5db;
                --border-color: #4b5563;
                --background: #1f2937;
                --input-background: #374151;
            }

            body {
                background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            }

            .login-container {
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            }
        }

        /* Print styles */
        @media print {
            body {
                background: white;
            }

            .login-container {
                box-shadow: none;
                border: 1px solid var(--border-color);
            }

            .login-button {
                background: var(--text-primary);
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Welcome Back</h1>
            <p>Sign in to access your member benefits</p>
        </div>

        <form class="login-form" id="loginForm" novalidate>
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input" 
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                    aria-describedby="emailError"
                />
                <span id="emailError" class="form-error" role="alert"></span>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                    aria-describedby="passwordError"
                />
                <span id="passwordError" class="form-error" role="alert"></span>
            </div>

            <div class="form-options">
                <div class="checkbox-group">
                    <input 
                        type="checkbox" 
                        id="remember" 
                        name="remember"
                        aria-label="Remember me"
                    />
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="login-button" aria-label="Sign in to your account">
                Sign In
            </button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');

            /**
             * Validates email format
             * @param {string} email - Email address to validate
             * @returns {boolean} - True if valid, false otherwise
             */
            function validateEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            /**
             * Displays error message for a field
             * @param {HTMLElement} errorElement - Error message element
             * @param {string} message - Error message to display
             */
            function showError(errorElement, message) {
                errorElement.textContent = message;
                errorElement.classList.add('active');
            }

            /**
             * Clears error message for a field
             * @param {HTMLElement} errorElement - Error message element
             */
            function clearError(errorElement) {
                errorElement.textContent = '';
                errorElement.classList.remove('active');
            }

            /**
             * Validates the login form
             * @returns {boolean} - True if form is valid, false otherwise
             */
            function validateForm() {
                let isValid = true;

                clearError(emailError);
                clearError(passwordError);

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email) {
                    showError(emailError, 'Email address is required');
                    isValid = false;
                } else if (!validateEmail(email)) {
                    showError(emailError, 'Please enter a valid email address');
                    isValid = false;
                }

                if (!password) {
                    showError(passwordError, 'Password is required');
                    isValid = false;
                } else if (password.length < 6) {
                    showError(passwordError, 'Password must be at least 6 characters');
                    isValid = false;
                }

                return isValid;
            }

            // Form submission handler
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                if (validateForm()) {
                    const submitButton = form.querySelector('.login-button');
                    submitButton.disabled = true;
                    submitButton.textContent = 'Signing in...';

                    // Simulate form submission
                    setTimeout(function() {
                        submitButton.disabled = false;
                        submitButton.textContent = 'Sign In';
                        alert('Login functionality would be implemented here');
                    }, 1500);
                }
            });

            // Real-time validation on blur
            emailInput.addEventListener('blur', function() {
                const email = emailInput.value.trim();
                if (email && !validateEmail(email)) {
                    showError(emailError, 'Please enter a valid email address');
                } else {
                    clearError(emailError);
                }
            });

            passwordInput.addEventListener('blur', function() {
                const password = passwordInput.value;
                if (password && password.length < 6) {
                    showError(passwordError, 'Password must be at least 6 characters');
                } else {
                    clearError(passwordError);
                }
