<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Member Benefits Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #dc2626;
            --primary-red-hover: #b91c1c;
            --primary-red-active: #991b1b;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --background: #ffffff;
            --input-background: #f9fafb;
            --error-color: #ef4444;
            --focus-ring: rgba(220, 38, 38, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: var(--input-background);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--background);
            border-radius: 8px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            padding: 2rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.625rem 0.875rem;
            font-size: 0.875rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--input-background);
            color: var(--text-primary);
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary-red);
            background-color: var(--background);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        .form-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            font-size: 0.875rem;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 1rem;
            height: 1rem;
            cursor: pointer;
            accent-color: var(--primary-red);
        }

        .checkbox-group label {
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .forgot-password {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary-red);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .btn-primary:hover {
            background-color: var(--primary-red-hover);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .btn-primary:active {
            background-color: var(--primary-red-active);
            transform: translateY(1px);
        }

        .btn-primary:focus {
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider span {
            padding: 0 0.75rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .signup-link {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .signup-link a {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .signup-link a:hover {
            color: var(--primary-red-hover);
            text-decoration: underline;
        }

        .error-message {
            display: none;
            padding: 0.75rem;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: var(--error-color);
            font-size: 0.875rem;
        }

        .error-message.show {
            display: block;
        }

        /* Mobile First - Base styles above are for mobile */

        /* Tablet breakpoint */
        @media (min-width: 640px) {
            body {
                padding: 1.5rem;
            }

            .login-container {
                padding: 2.5rem;
            }

            .login-header h1 {
                font-size: 2rem;
            }

            .login-header p {
                font-size: 1rem;
            }

            .form-input {
                padding: 0.75rem 1rem;
                font-size: 1rem;
            }

            .form-label {
                font-size: 1rem;
            }

            .btn-primary {
                padding: 0.875rem 1.25rem;
                font-size: 1rem;
            }

            .form-options {
                font-size: 1rem;
            }

            .signup-link {
                font-size: 1rem;
            }
        }

        /* Desktop breakpoint */
        @media (min-width: 1024px) {
            body {
                padding: 2rem;
            }

            .login-container {
                max-width: 450px;
                padding: 3rem;
            }

            .login-header {
                margin-bottom: 2.5rem;
            }

            .login-header h1 {
                font-size: 2.25rem;
            }

            .login-form {
                gap: 1.5rem;
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            }

            .btn-primary:active {
                transform: translateY(0);
            }
        }

        /* Large desktop breakpoint */
        @media (min-width: 1280px) {
            .login-container {
                max-width: 480px;
            }
        }

        /* Accessibility improvements */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .login-container {
                border: 2px solid var(--text-primary);
            }

            .form-input {
                border-width: 2px;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --text-primary: #f9fafb;
                --text-secondary: #d1d5db;
                --border-color: #4b5563;
                --background: #1f2937;
                --input-background: #111827;
            }

            body {
                background-color: #111827;
            }

            .error-message {
                background-color: #7f1d1d;
                border-color: #991b1b;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Member Benefits</h1>
            <p>Sign in to access your account</p>
        </div>

        <div id="errorMessage" class="error-message" role="alert" aria-live="polite"></div>

        <form class="login-form" id="loginForm" novalidate>
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-input" 
                    placeholder="you@example.com"
                    required
                    autocomplete="email"
                    aria-required="true"
                    aria-describedby="emailError"
                />
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                    aria-required="true"
                    aria-describedby="passwordError"
                />
            </div>

            <div class="form-options">
                <div class="checkbox-group">
                    <input 
                        type="checkbox" 
                        id="remember" 
                        name="remember"
                        aria-label="Remember me"
                    />
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary" id="loginButton">
                Sign In
            </button>
        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginButton = document.getElementById('loginButton');
            const errorMessage = document.getElementById('errorMessage');

            /**
             * Display error message to user
             * @param {string} message - Error message to display
             */
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.add('show');
                errorMessage.setAttribute('role', 'alert');
            }

            /**
             * Hide error message
             */
            function hideError() {
                errorMessage.textContent = '';
                errorMessage.classList.remove('show');
                errorMessage.removeAttribute('role');
            }

            /**
             * Validate email format
             * @param {string} email - Email address to validate
             * @returns {boolean} - True if valid, false otherwise
             */
            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }

            /**
             * Handle form submission
             * @param {Event} event - Form submit event
             */
            function handleSubmit(event) {
                event.preventDefault();
                hideError();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                // Validation
                if (!email) {
                    showError('Please enter your email address.');
                    emailInput.focus();
                    return;
                }

                if (!isValidEmail(email)) {
                    showError('Please enter a valid email address.');
                    emailInput.focus();
                    return;
                }

                if (!password) {
                    showError('Please enter your password.');
                    passwordInput.focus();
                    return;
                }

                if (password.length < 6) {
                    showError('Password must be at least 6 characters long.');
                    passwordInput.focus();
                    return;
                }

                // Disable form during submission
                loginButton.disabled = true;
                loginButton.textContent = 'Signing In...';
                emailInput.disabled = true;
                passwordInput.disabled = true;

                // Simulate API call (replace with actual authentication logic)
                setTimeout(function() {
                    // Re-enable form
                    loginButton.disabled = false;
                    loginButton.textContent = 'Sign In';
                    emailInput.disabled = false;
